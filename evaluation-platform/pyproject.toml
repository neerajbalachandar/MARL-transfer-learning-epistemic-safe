[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-evaluation-platform"
version = "0.1.0"
description = "Read-only, provenance-preserving MARL transfer experiment ingestion and comparison"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "matplotlib>=3.7"]

[project.scripts]
transfer-eval = "transfer_eval.cli:main"
eval-platform = "transfer_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
